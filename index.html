<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解忧签 · 摇一签，解千愁</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;900&display=swap" rel="stylesheet">
<style>
/* ===== 基础与原站样式保留 ===== */
:root{--paper:#f5f0e6;--paper-dark:#ece5d8;--red:#c0392b;--red-dark:#96281b;--ink:#2c2c2c;--ink-light:#8a8378;--bamboo:#c9a86a;--gold:#e8c87a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Serif SC',serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative;}
.watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Ma Shan Zheng',cursive;font-size:60vmin;color:rgba(192,57,43,.04);pointer-events:none;user-select:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px;}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.brand{display:flex;gap:14px;align-items:center;}
.seal{width:56px;height:56px;background:var(--red);color:var(--paper);display:grid;place-items:center;font-family:'Ma Shan Zheng',cursive;font-size:30px;border-radius:6px;box-shadow:2px 2px 0 rgba(0,0,0,.12);}
.brand h1{font-size:26px;letter-spacing:6px;font-weight:600;}
.brand .sub{font-size:11px;letter-spacing:3px;color:var(--ink-light);margin-top:2px;}
.meta{font-size:13px;color:var(--ink-light);margin-top:8px;}
.meta b{color:var(--red);font-size:15px;}
.dot{display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:5px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{padding:9px 18px;border:1px solid rgba(44,44,44,.15);background:rgba(255,255,255,.5);border-radius:20px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:.25s;letter-spacing:1px;}
.btn:hover{background:var(--red);color:var(--paper);border-color:var(--red);transform:translateY(-1px);}
.btn.primary{background:var(--red);color:var(--paper);border-color:var(--red);}
.btn.primary:hover{background:var(--red-dark);}
main{display:grid;grid-template-columns:minmax(320px,42%) 1fr;gap:24px;margin-top:26px;align-items:center;justify-items:center;min-height:calc(100vh - 340px);}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:430px;}
.stage{display:flex;flex-direction:column;align-items:center;padding:20px 0;position:relative;}
.result{margin-top:0;width:100%;max-width:340px;opacity:0;transform:translateY(24px) scale(.96);transition:.55s cubic-bezier(.2,.9,.3,1);pointer-events:none;}
.result.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.card{background:#fffdf7;border:1px solid rgba(192,57,43,.2);border-radius:4px;padding:28px 24px;text-align:center;position:relative;box-shadow:0 10px 34px rgba(0,0,0,.1);}
.level{display:inline-block;padding:4px 16px;border-radius:2px;font-size:13px;letter-spacing:3px;background:var(--red);color:var(--paper);margin-bottom:18px;}
.card p{font-family:'Ma Shan Zheng',cursive;font-size:24px;line-height:1.7;}
.card .no{margin-top:16px;font-size:11px;color:var(--ink-light);letter-spacing:2px;}
.actions{display:flex;gap:10px;margin-top:16px;justify-content:center;}

/* ===== 弹窗与遮罩基础 ===== */
.mask{position:fixed;inset:0;background:rgba(44,44,44,.42);z-index:120;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
.mask.on{display:flex;}
.pop{background:var(--paper);border-radius:10px;max-width:400px;width:100%;padding:24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;border:1px solid rgba(192,57,43,.2);max-height:80vh;overflow:auto;}
.pop h3{font-size:17px;letter-spacing:4px;margin-bottom:4px;}
.pop .tip{font-size:11px;color:var(--ink-light);margin-bottom:14px;letter-spacing:1px;}
.pop .close{position:absolute;top:12px;right:14px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink-light);line-height:1;}
.pop .close:hover{color:var(--red);}
.empty{text-align:center;color:var(--ink-light);font-size:12px;padding:18px 0;letter-spacing:1px;}

/* ===== 大厅（茶话会）与私聊专属样式 ===== */
.hall-pop{max-width:620px;height:70vh;display:flex;flex-direction:column;}
.hall-msgs,.soc-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.03);border-radius:8px;border:1px solid rgba(0,0,0,.05);}
.hall-msgs::-webkit-scrollbar,.soc-msgs::-webkit-scrollbar{width:3px;}
.hall-msgs::-webkit-scrollbar-thumb,.soc-msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);}
.hall-msg{font-size:13px;line-height:1.6;word-break:break-word;animation:fadeIn .3s;}
.hall-msg .nick{color:var(--red);font-weight:600;margin-right:6px;}
.hall-msg .nick.me{color:#2e7d5b;}
.hall-msg .tm{font-size:10px;color:var(--ink-light);margin-left:6px;}
.soc-input{display:flex;gap:8px;align-items:flex-end;padding-top:10px;border-top:1px dashed rgba(0,0,0,.12);margin-top:10px;}
.soc-input textarea{flex:1;min-height:38px;max-height:96px;resize:none;padding:9px 11px;border:1px solid rgba(44,44,44,.18);border-radius:8px;background:#fffdf7;font-family:inherit;font-size:13px;line-height:1.6;outline:none;transition:.25s;}
.soc-input textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.12);}
.nav-badge{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:6px;border-radius:9px;background:var(--gold);color:#4a3410;font-size:10px;text-align:center;vertical-align:1px;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;}

/* 好友弹窗基础布局 */
.social-pop .pop{max-width:800px;width:100%;}
.soc-body{display:grid;grid-template-columns:240px 1fr;gap:16px;height:60vh;}
.soc-side{border-right:1px dashed rgba(0,0,0,.12);padding-right:12px;overflow-y:auto;}
.soc-list{list-style:none;font-size:12px;}
.soc-list li{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px dashed rgba(0,0,0,.08);}
.soc-ava{width:24px;height:24px;border-radius:50%;background:rgba(192,57,43,.12);color:var(--red);display:grid;place-items:center;font-family:'Ma Shan Zheng',cursive;}
@media(max-width:760px){.soc-body{grid-template-columns:1fr;}.soc-side{border-right:0;border-bottom:1px dashed rgba(0,0,0,.12);}}
</style>
</head>
<body>
<div class="watermark">签</div>
<div class="wrap">
<header>
  <div>
    <div class="brand">
      <div class="seal">签</div>
      <div><h1>解忧签</h1><div class="sub">JIE YOU QIAN</div></div>
    </div>
    <div class="meta">
      <span class="badge local" id="cloudBadge" style="margin-top:8px;display:inline-block;padding:4px 8px;border-radius:4px;background:rgba(0,0,0,.06);font-size:11px;">
        <span class="dot"></span><span id="cloudText">连接中…</span>
      </span>
    </div>
  </div>
  <nav class="nav">
    <button class="btn" onclick="drawSign()">摇一签</button>
    <button class="btn" id="hallBtn" onclick="openHall()" title="无需加好友，全站公共聊天">茶话会<span class="nav-badge" id="hallBadge" hidden>0</span></button>
    <button class="btn" id="friendBtn" onclick="openSocial()" title="搜索账号、加好友、私聊">签友</button>
    <button class="btn" onclick="openSettings()" title="设置">⚙ 设置</button>
  </nav>
</header>

<main>
  <section class="stage" id="stageBox" onclick="drawSign()" style="cursor:pointer;text-align:center;">
    <div style="font-size:100px;font-family:'Ma Shan Zheng',cursive;color:var(--red);text-shadow:0 0 20px rgba(192,57,43,.3);">签</div>
    <div class="hint" style="margin-top:20px;">轻点摇签筒</div>
  </section>
  <section class="side">
    <div class="result" id="result">
      <div class="card">
        <span class="level" id="level">上上签</span>
        <p id="text">签文内容</p>
        <div class="no" id="signNo">第 001 签</div>
      </div>
    </div>
  </section>
</main>
</div>

<!-- ===== 大厅（茶话会）弹窗 ===== -->
<div class="mask" id="hallMask">
  <div class="pop hall-pop">
    <button class="close" onclick="closeHall()">&times;</button>
    <h3>解忧茶话会</h3>
    <div class="tip">全站公共大厅 · 无需加好友即可畅聊</div>
    <div class="hall-msgs" id="hallMsgs">
      <div class="empty">连接中…</div>
    </div>
    <div class="soc-input">
      <textarea id="hallMsgInput" rows="1" maxlength="200" placeholder="对大家说点什么…（Enter 发送）"></textarea>
      <button class="btn primary mini" onclick="sendHallMsg()">发送</button>
    </div>
  </div>
</div>

<!-- ===== 好友与聊天弹窗 ===== -->
<div class="mask social-pop" id="socialMask">
  <div class="pop">
    <button class="close" onclick="closeSocial()">&times;</button>
    <h3>签友 · 传话</h3>
    <div class="soc-body">
      <div class="soc-side">
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <input id="socSearchInput" style="flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;" placeholder="搜索用户名">
          <button class="btn mini" onclick="searchUsers()">搜索</button>
        </div>
        <ul class="soc-list" id="socSearchList"><li class="soc-hint">搜索后添加好友</li></ul>
        <div style="margin:12px 0 4px;font-size:12px;font-weight:bold;">我的好友</div>
        <ul class="soc-list" id="socFriendList"><li>加载中…</li></ul>
      </div>
      <div class="soc-main" style="display:flex;flex-direction:column;">
        <div style="font-size:13px;font-weight:bold;margin-bottom:8px;" id="socChatHead">请选择好友聊天</div>
        <div class="soc-msgs" id="socMsgs"></div>
        <div class="soc-input">
          <textarea id="socMsgInput" rows="1" maxlength="500" placeholder="说点什么…（Enter 发送）"></textarea>
          <button class="btn primary mini" onclick="sendMsg()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;display:none;z-index:999;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ================= 基础工具与数据 ================= */
const SIGNS = [{id:1, level:'上上签', type:'ji', text:'今日宜向前一步，你等的机会已在路上。'}, {id:2, level:'下签', type:'xiong', text:'今日诸事不宜，不如早点休息。'}];
const SUPABASE_URL = 'https://qwokxoxlojbhhhrhctuc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3b2t4b3hsb2piaGhocmhjdHVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzMzU2MzUsImV4cCI6MjExMDkxMTYzNX0.-l7wzlfPBld2fEGk5Fi87fSi_LNg-5IchBmwjb6RcGs';

let MY_ID = localStorage.getItem('jieyou_id') || 'v_' + Date.now().toString(36);
localStorage.setItem('jieyou_id', MY_ID);
let MY_NICK = localStorage.getItem('jieyou_nick') || '访客' + MY_ID.slice(-4);
let CUR_USER = 'guest'; // 当前用户名
let lastHallReadTime = Date.now(), unreadHallCount = 0;
let currentPeerId = null;

function esc(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(()=>t.style.display='none', 3000); }
function drawSign() {
  const s = SIGNS[Math.floor(Math.random()*SIGNS.length)];
  document.getElementById('level').textContent = s.level;
  document.getElementById('text').textContent = s.text;
  document.getElementById('signNo').textContent = '第 ' + s.id + ' 签';
  document.getElementById('result').classList.add('show');
  if(Cloud.isOn()) Cloud.recordDraw(s);
}

/* ================= Supabase 云端模块 ================= */
const Cloud = (() => {
  let sb = null, available = false;
  async function init() {
    if(!window.supabase) return console.warn('SDK未加载');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    try {
      // 确保有用户身份（修复原本的时序 bug）
      const { data, error } = await sb.from('users').upsert({ id: MY_ID, nickname: MY_NICK }, { onConflict: 'id' });
      if (error) throw error;
      available = true;
      document.getElementById('cloudText').textContent = '已连接云端';
      document.getElementById('cloudBadge').style.color = '#2e7d5b';
      initRealtime();
      return true;
    } catch(e) {
      console.warn('云端连接失败', e);
      document.getElementById('cloudText').textContent = '离线模式';
      return false;
    }
  }

  async function recordDraw(sign) {
    if(!available) return;
    await sb.from('draws').insert({ user_id: MY_ID, nickname: MY_NICK, sign_id: sign.id, sign_level: sign.level, is_hidden: false });
  }

  // 发送消息（统一接口，大厅传 public_hall）
  async function sendMessage(toId, text) {
    if(!available) return false;
    const { error } = await sb.from('messages').insert({ from_id: MY_ID, to_id: toId, content: text, from_nick: MY_NICK });
    return !error;
  }

  async function fetchMessages(peerId, limit = 50) {
    if(!available) return [];
    let query = sb.from('messages').select('*');
    if(peerId === 'public_hall') {
      query = query.eq('to_id', 'public_hall');
    } else {
      query = query.or(`and(from_id.eq.${MY_ID},to_id.eq.${peerId}),and(from_id.eq.${peerId},to_id.eq.${MY_ID})`);
    }
    const { data, error } = await query.order('created_at', { ascending: false }).limit(limit);
    return error ? [] : (data || []).reverse();
  }

  // 获取好友列表
  async function fetchFriends() {
    if(!available) return [];
    const { data, error } = await sb.from('friends').select('*')
      .or(`user_id.eq.${MY_ID},friend_id.eq.${MY_ID}`).eq('status', 'accepted');
    return error ? [] : (data || []);
  }
  
  // 搜索用户
  async function searchUsers(kw) {
    if(!available) return [];
    const { data, error } = await sb.from('users').select('*').ilike('username', `%${kw}%`).limit(10);
    if (error) {
        const { data: d2 } = await sb.from('users').select('*').ilike('nickname', `%${kw}%`).limit(10);
        return d2 || [];
    }
    return data || [];
  }

  // 发送好友申请
  async function sendFriendRequest(toId, toNick) {
    if(!available) return false;
    const { error } = await sb.from('friends').insert({ user_id: MY_ID, friend_id: toId, status: 'pending', nickname: MY_NICK, friend_nickname: toNick });
    return !error;
  }

  // 实时订阅（合并大厅、私聊、好友）
  function initRealtime() {
    if(!available) return;
    sb.channel('chat_room')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const row = payload.new;
        if(row.to_id === 'public_hall') {
          // 大厅消息
          if(document.getElementById('hallMask').classList.contains('on')) {
            renderHallMsg(row);
          } else if(row.from_id !== MY_ID) {
            unreadHallCount++;
            const badge = document.getElementById('hallBadge');
            badge.textContent = unreadHallCount;
            badge.hidden = false;
          }
        } else if(row.to_id === MY_ID || row.from_id === MY_ID) {
          // 私聊消息
          if(document.getElementById('socialMask').classList.contains('on') && (currentPeerId === row.from_id || currentPeerId === row.to_id)) {
            renderPrivateMsg(row);
          }
        }
      })
      .subscribe();
  }

  return { init, recordDraw, sendMessage, fetchMessages, fetchFriends, searchUsers, sendFriendRequest, isOn: () => available };
})();

/* ================= 大厅（茶话会）逻辑 ================= */
async function openHall() {
  unreadHallCount = 0;
  document.getElementById('hallBadge').hidden = true;
  document.getElementById('hallMask').classList.add('on');
  const list = document.getElementById('hallMsgs');
  list.innerHTML = '<div class="empty">加载中…</div>';
  
  if(!Cloud.isOn()) return list.innerHTML = '<div class="empty">未连接云端，无法进入大厅</div>';
  
  const msgs = await Cloud.fetchMessages('public_hall', 100);
  list.innerHTML = msgs.length ? '' : '<div class="empty">这里静悄悄的，说句话吧~</div>';
  msgs.forEach(renderHallMsg);
  list.scrollTop = list.scrollHeight;
}

function closeHall() { document.getElementById('hallMask').classList.remove('on'); }

function renderHallMsg(m) {
  const list = document.getElementById('hallMsgs');
  const empty = list.querySelector('.empty');
  if(empty) empty.remove();
  const isMe = m.from_id === MY_ID;
  const time = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const div = document.createElement('div');
  div.className = 'hall-msg';
  div.innerHTML = `<span class="nick ${isMe?'me':''}">${esc(m.from_nick || '神秘人')}</span> <span>${esc(m.content)}</span> <span class="tm">${time}</span>`;
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
}

async function sendHallMsg() {
  const input = document.getElementById('hallMsgInput');
  const txt = input.value.trim();
  if(!txt) return;
  input.value = '';
  const ok = await Cloud.sendMessage('public_hall', txt);
  if(!ok) toast('发送失败，请检查权限');
}

/* ================= 私聊与好友逻辑 ================= */
async function openSocial() {
  document.getElementById('socialMask').classList.add('on');
  loadFriendList();
}

function closeSocial() { document.getElementById('socialMask').classList.remove('on'); currentPeerId = null; }

async function searchUsers() {
  const kw = document.getElementById('socSearchInput').value.trim();
  if(!kw) return;
  const users = await Cloud.searchUsers(kw);
  const list = document.getElementById('socSearchList');
  list.innerHTML = users.length ? '' : '<li class="soc-hint">未找到用户</li>';
  users.forEach(u => {
    if(u.id === MY_ID) return;
    const li = document.createElement('li');
    li.innerHTML = `<div class="soc-ava">${esc(u.nickname[0])}</div>
                    <div style="flex:1;">${esc(u.nickname)}</div>
                    <button class="btn mini" onclick="addFriend('${u.id}','${esc(u.nickname)}')">加好友</button>`;
    list.appendChild(li);
  });
}

async function addFriend(toId, toNick) {
  const ok = await Cloud.sendFriendRequest(toId, toNick);
  toast(ok ? '好友申请已发送' : '发送失败，请查看控制台（可能权限不足）');
}

async function loadFriendList() {
  const friends = await Cloud.fetchFriends();
  const list = document.getElementById('socFriendList');
  list.innerHTML = friends.length ? '' : '<li class="soc-hint">暂无好友</li>';
  friends.forEach(f => {
    const isMe = f.user_id === MY_ID;
    const peerId = isMe ? f.friend_id : f.user_id;
    const peerNick = isMe ? f.friend_nickname : f.nickname;
    const li = document.createElement('li');
    li.innerHTML = `<div class="soc-ava">${esc((peerNick||'友')[0])}</div>
                    <div style="flex:1;" onclick="openPrivateChat('${peerId}','${esc(peerNick)}')">${esc(peerNick)}</div>`;
    list.appendChild(li);
  });
}

async function openPrivateChat(peerId, peerNick) {
  currentPeerId = peerId;
  document.getElementById('socChatHead').textContent = '正在与 ' + peerNick + ' 聊天';
  const list = document.getElementById('socMsgs');
  list.innerHTML = '加载中...';
  const msgs = await Cloud.fetchMessages(peerId, 50);
  list.innerHTML = '';
  msgs.forEach(renderPrivateMsg);
}

function renderPrivateMsg(m) {
  const list = document.getElementById('socMsgs');
  const isMe = m.from_id === MY_ID;
  const div = document.createElement('div');
  div.style.cssText = `padding:8px 12px;border-radius:8px;font-size:13px;max-width:80%;margin:4px 0;${isMe?'align-self:flex-end;background:var(--red);color:#fff;':'align-self:flex-start;background:#fff;'}`;
  div.textContent = m.content;
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
}

async function sendMsg() {
  if(!currentPeerId) return toast('请先选择好友');
  const input = document.getElementById('socMsgInput');
  const txt = input.value.trim();
  if(!txt) return;
  input.value = '';
  await Cloud.sendMessage(currentPeerId, txt);
}

function openSettings() { toast('设置功能待完善'); }

// 绑定回车发送
document.getElementById('hallMsgInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendHallMsg(); } });
document.getElementById('socMsgInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });

// 启动
Cloud.init();
</script>
</body>
</html>
